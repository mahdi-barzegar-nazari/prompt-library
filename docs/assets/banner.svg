<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">CS &amp; Learning Prompt Library</title>
  <desc id="d">Curated portable system prompts for tutoring, coaching, and planning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1b1f4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#94a3b8" font-size="20">
    <text x="70" y="95">$ cat prompts/coding-coach-prompt.txt</text>
  </g>
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="70" y="170" font-size="56" font-weight="700" fill="#f8fafc">CS &amp; Learning Prompt Library</text>
    <text x="70" y="220" font-size="26" fill="#cbd5e1">Curated portable system prompts: tutor, coach, planner.</text>
  </g>
  <rect x="70" y="245" width="220" height="5" rx="2.5" fill="url(#accent)"/>
</svg>
